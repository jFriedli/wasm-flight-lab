[workspace]
members = ["crates/flight-core", "crates/flight-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jFriedli/wasm-flight-lab"

[workspace.dependencies]
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

